{% extends "base.html" %}
{% block title %}Report an issue — COSSA Dues{% endblock %}
{% block content %}
<div class="card">
  <h2>Report an issue</h2>
  <p class="lede">Couldn&rsquo;t be matched, or something looks wrong? Tell us and we&rsquo;ll sort it out by hand.</p>
  <form method="post" action="/issue">
    <label>Full name (as in school records)
      <input type="text" name="full_name" required>
    </label>
    <label>Student ID
      <input type="text" name="student_id" required>
    </label>
    <label>Phone number
      <input type="tel" name="phone_number" required>
    </label>
    <label>Personal email <span class="optional">(optional)</span>
      <input type="email" name="email">
    </label>
    <label>I am a
      <select name="category" required>
        <option value="continuing_student">Continuing Student</option>
        <option value="fresher">Fresher</option>
      </select>
    </label>
    <label>What&rsquo;s the issue?
      <textarea name="reason" rows="4" required></textarea>
    </label>
    <button type="submit">Submit</button>
  </form>
</div>
{% endblock %}
